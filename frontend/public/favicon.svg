  <!-- Base de arroz blanca redondeada -->
  <path d="M 10 50 C 10 32, 90 32, 90 50 C 90 74, 10 74, 10 50 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
  
  <!-- Textura del arroz -->
  <ellipse cx="28" cy="60" rx="6" ry="3" fill="#EDF2F7" />
  <ellipse cx="45" cy="64" rx="7" ry="3.5" fill="#EDF2F7" />

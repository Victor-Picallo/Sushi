  <path d="M 12 40 C 22 24, 78 24, 88 40 C 88 46, 12 46, 12 40 Z" fill="#FF7B7B" opacity="0.6" />
  <path d="M 25 24 Q 30 40 33 52" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.75" />
  <path d="M 45 20 Q 50 38 53 52" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.75" />
  <path d="M 65 24 Q 70 40 73 52" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.75" />
  
  <!-- Banda de Nori (alga) central -->
  <rect x="41" y="20" width="18" height="48" rx="3" fill="#1A202C" />
  <rect x="44" y="20" width="3" height="48" fill="#2D3748" />
</svg>